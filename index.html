
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>算法竞赛模板</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

  <style>
    /* GitHub Light-inspired syntax highlighting for Docsify */
    .markdown-section pre {
      background: #f6f8fa !important;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 16px !important;
      margin: 16px 0;
      overflow-x: auto;
      box-shadow: none;
    }

    .markdown-section pre > code {
      display: block;
      background: transparent !important;
      color: #24292f !important;
      padding: 0 !important;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo,
                   Consolas, "Liberation Mono", monospace;
      font-size: 13.5px;
      line-height: 1.55;
      text-shadow: none;
    }

    .markdown-section pre::after {
      color: #6e7781;
    }

    .markdown-section pre .token.comment,
    .markdown-section pre .token.prolog,
    .markdown-section pre .token.doctype,
    .markdown-section pre .token.cdata {
      color: #6e7781;
    }

    .markdown-section pre .token.keyword,
    .markdown-section pre .token.boolean {
      color: #cf222e;
    }

    .markdown-section pre .token.string,
    .markdown-section pre .token.char,
    .markdown-section pre .token.attr-value {
      color: #0a3069;
    }

    .markdown-section pre .token.function {
      color: #8250df;
    }

    .markdown-section pre .token.number,
    .markdown-section pre .token.constant,
    .markdown-section pre .token.symbol {
      color: #0550ae;
    }

    .markdown-section pre .token.class-name,
    .markdown-section pre .token.builtin,
    .markdown-section pre .token.namespace {
      color: #953800;
    }

    .markdown-section pre .token.operator,
    .markdown-section pre .token.punctuation {
      color: #24292f;
    }

    .markdown-section pre .token.preprocessor,
    .markdown-section pre .token.macro,
    .markdown-section pre .token.directive {
      color: #cf222e;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    window.$docsify = {
      name: '算法竞赛模板',
      repo: 'https://github.com/Yangzhk/templete',
      loadSidebar: true,
      subMaxLevel: 3,
      search: 'auto',
      latex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      }
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-latex@0"></script>
</body>
</html>
